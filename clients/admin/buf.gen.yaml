version: v2
inputs:
  # Only the platform admin RPCs. The product protos and other apps' consoles stay out of this
  # bundle (docs/design/admin-consoles.md §3).
  - directory: ../../services/api/src/ProtoFast.Api/Protos
    paths:
      - ../../services/api/src/ProtoFast.Api/Protos/Admin/Shared
plugins:
  - local: protoc-gen-es
    out: src/lib/gen
    opt: target=ts
clean: true

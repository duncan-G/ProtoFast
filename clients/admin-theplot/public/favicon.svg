<!--
  Protofast mark — direction 2d "Swarm" from the Claude Design canvas
  "Protofast Landing" (option 2d): parallel agent strokes converging on one
  shipped app.

  This is the reduced small-size cut of the lockup in
  src/app/shared/protofast-logo.ts: three strokes rather than five, and the
  whole ramp lifted to accent-600 so it still carries at 16px on a browser tab.
  Standalone file, so the Nocturne tokens are inlined as their hex values —
  surface #232532, accent-600 #796cbf, accent #9184d9.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Protofast">
  <rect width="32" height="32" rx="7" fill="#232532"/>
  <g stroke="#796cbf" stroke-width="3" stroke-linecap="round">
    <path d="M7 10 H14"/>
    <path d="M7 16 H17"/>
    <path d="M7 22 H14"/>
  </g>
  <circle cx="23.5" cy="16" r="3.5" fill="#9184d9"/>
</svg>

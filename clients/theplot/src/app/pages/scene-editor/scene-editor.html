<div class="ember scene-editor antialiased" [attr.data-theme]="theme()">
  <header class="se-header">
    <a routerLink="/app" class="se-logo" aria-label="ThePlot — back to your desk"
      ><app-theplot-logo
    /></a>

    <nav class="se-crumbs" aria-label="Breadcrumb">
      <span class="se-crumb-story" [title]="store.story()?.title ?? ''">{{
        store.story()?.title
      }}</span>
      <span aria-hidden="true">/</span>
      <app-container-menu />
    </nav>

    <div class="se-scene-nav">
      <button
        type="button"
        class="se-btn se-btn-icon"
        title="Previous scene"
        aria-label="Previous scene"
        [disabled]="!store.previous()"
        (click)="store.go(store.previous()!.summary.id)"
      >
        ‹
      </button>
      <span class="se-scene-badge"
        >SCENE {{ sceneNumber() }}<span> / {{ sceneCount() }}</span></span
      >
      <button
        type="button"
        class="se-btn se-btn-icon"
        title="Next scene"
        aria-label="Next scene"
        [disabled]="!store.next()"
        (click)="store.go(store.next()!.summary.id)"
      >
        ›
      </button>
    </div>

    <input
      #titleField
      class="se-title-input"
      aria-label="Scene title"
      placeholder="Scene title"
      maxlength="255"
      [value]="store.scene()?.title ?? ''"
      (input)="store.setTitle($any($event.target).value)"
      (blur)="store.commitTitle()"
      (keydown.enter)="titleField.blur()"
    />

    <div class="se-tools">
      <button
        type="button"
        class="se-btn se-library-toggle"
        [attr.aria-pressed]="store.libraryOpen()"
        (click)="toggleLibrary()"
      >
        Library
      </button>
      <button
        type="button"
        class="se-btn"
        title="Switch light / dark"
        [attr.aria-label]="theme() === 'dark' ? 'Light theme' : 'Dark theme'"
        (click)="toggleTheme()"
      >
        {{ theme() === 'dark' ? '☀' : '☾'
        }}<span class="se-btn-label">{{ theme() === 'dark' ? 'Light' : 'Dark' }}</span>
      </button>
      <button
        type="button"
        class="se-btn"
        [attr.aria-pressed]="showOverview()"
        (click)="toggleOverview()"
      >
        Overview
      </button>
    </div>
  </header>

  @if (store.error(); as error) {
    <div class="se-alert" role="alert">
      <span class="flex-1">{{ error }}</span>
      <button type="button" class="se-btn" (click)="store.error.set('')">Dismiss</button>
    </div>
  }

  <div class="se-body">
    <app-library-panel [class.is-open]="store.libraryOpen()" />
    @if (store.libraryOpen() || showOverview()) {
      <div class="se-scrim" aria-hidden="true" (click)="closeDrawers()"></div>
    }
    @if (store.scene()) {
      <app-story-view />
    } @else {
      <section class="dr-center" aria-label="Scene">
        @if (store.loading()) {
          <p class="se-kicker mt-10 flex items-center justify-center gap-2">
            <span class="spinner" aria-hidden="true"></span>Opening the scene…
          </p>
        }
      </section>
    }
    @if (showOverview()) {
      <app-overview-panel class="st-overview" (jump)="jump($event)" />
    }
  </div>
</div>

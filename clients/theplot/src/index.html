<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ThePlot</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14110f" />
    <meta
      name="description"
      content="Write it. Read it. Watch it. Publish chapters on ThePlot and your readers can open them as prose — or press play and watch an AI-generated adaptation, scene by scene, drawn straight from your words."
    />
    <!-- SVG first for browsers that take it (it stays crisp on hi-dpi tabs);
         the .ico carries the raster cuts for everything else. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48 64x64" />
    <!-- Newsreader (display serif), Geist (UI) and JetBrains Mono (kickers/meta)
         carry Ember's three registers; Courier Prime sets the scene editor's script.
         Linked here rather than @import-ed from the stylesheet, which would
         chain-block rendering. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Courier+Prime:wght@400;700&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

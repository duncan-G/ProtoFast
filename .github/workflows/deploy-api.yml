name: deploy-api

on:
  push:
    branches: [main]
    paths:
      - "services/api/**"
      - "services/document_import/**"
      - "services/shared/**"
      - ".github/workflows/deploy-api.yml"
      - ".github/workflows/_component-deploy.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing artifact tag to (re)deploy or roll back to. Blank = build current source."
        required: false
        type: string

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_component-deploy.yml
    with:
      component: api
      host: services
      build: dotnet
      target: protofast-api
      kind: service
      # document_import is a project reference of the api (source formats, storage keys), so a
      # change there must rebuild the api too.
      hash_paths: "services/api services/document_import services/shared"
      project: services/api/src/ProtoFast.Api
      tag: ${{ inputs.tag }}
      # The `protofast` DB migrations runner ships WITH the api, exactly as auth-migrations
      # does with auth: same content tag, applied immediately before api in one deploy.sh
      # invocation, so run_api_migrations always reads an API_MIGRATIONS_TAG that matches.
      companion: api-migrations
      companion_target: protofast-api-migrations
      companion_project: services/api/src/ProtoFast.SchemaMigrations
    secrets: inherit

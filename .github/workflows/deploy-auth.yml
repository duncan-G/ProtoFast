name: deploy-auth

on:
  push:
    branches: [main]
    paths:
      - "services/auth/**"
      - "services/shared/**"
      - ".github/workflows/deploy-auth.yml"
      - ".github/workflows/_component-deploy.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing artifact tag to (re)deploy or roll back to. Blank = build current source."
        required: false
        type: string

concurrency:
  group: deploy-auth
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_component-deploy.yml
    with:
      component: auth
      host: services
      build: dotnet
      target: protofast-auth
      kind: service
      hash_paths: "services/auth services/shared"
      project: services/auth/src/ProtoFast.Auth.Api
      tag: ${{ inputs.tag }}
      # The schema-migrations runner ships WITH auth: same hash_paths → same content
      # tag, built in the same job, and applied immediately before auth in one
      # deploy.sh invocation. run_auth_migrations therefore always reads an
      # AUTH_MIGRATIONS_TAG that matches the auth image being deployed.
      companion: auth-migrations
      companion_target: protofast-auth-migrations
      companion_project: services/auth/src/ProtoFast.Auth.SchemaMigrations
    secrets: inherit

name: deploy-auth-migrations

# MANUAL ONLY — pinning/rolling back AUTH_MIGRATIONS_TAG on its own.
#
# The normal path is deploy-auth, which builds this image as a companion (same
# content tag) and applies auth-migrations immediately before auth in ONE deploy.sh
# invocation. This workflow deliberately has NO push trigger: when it had one, it
# and deploy-auth both fired on services/auth/** with no ordering between them, so
# deploy-auth could win and run the PREVIOUS migrations image — recreating auth
# against an un-migrated schema, silently.
#
# Applying this component only pulls the image and pins the tag; the migration RUN
# is always the auth apply's fail-closed pre-step (deploy.sh run_auth_migrations).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing artifact tag to (re)deploy or roll back to. Blank = build current source."
        required: false
        type: string

# Shares deploy-auth's group: a manual migrations pin must never run concurrently
# with an auth deploy that is about to read AUTH_MIGRATIONS_TAG.
concurrency:
  group: deploy-auth
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/_component-deploy.yml
    with:
      component: auth-migrations
      host: services
      build: dotnet
      target: protofast-auth-migrations
      kind: service
      hash_paths: "services/auth services/shared"
      project: services/auth/src/ProtoFast.Auth.SchemaMigrations
      tag: ${{ inputs.tag }}
    secrets: inherit

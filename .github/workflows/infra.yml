# Plans, applies or destroys prod's platform (infra/prod) by hand, and applies it when its root
# changes on main. deploy.yml applies it too when a release changes what the spec needs.
name: infra

on:
  push:
    branches: [main]
    paths: [infra/prod/**]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read
  id-token: write

jobs:
  infra:
    uses: duncan-G/protostrap/.github/workflows/infra.yml@v0.1.3
    with:
      environment: prod
      directory: infra/prod
      action: ${{ github.event_name == 'push' && 'apply' || inputs.action }}
      protostrap-ref: v0.1.3
    secrets: inherit

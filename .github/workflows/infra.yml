# Plans, applies or destroys prod's platform (infra/prod) by hand. deploy.yml applies it too when
# a release changes what the spec needs.
name: infra

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  contents: read
  id-token: write

jobs:
  infra:
    uses: duncan-G/protostrap/.github/workflows/infra.yml@v0.1.12
    with:
      environment: prod
      directory: infra/prod
      action: ${{ inputs.action }}
      protostrap-ref: v0.1.12
    secrets: inherit

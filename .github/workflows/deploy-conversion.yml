name: deploy-conversion

on:
  push:
    branches: [main]
    paths:
      - "services/conversion/**"
      - ".github/workflows/deploy-conversion.yml"
      - ".github/workflows/_component-deploy.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing artifact tag to (re)deploy or roll back to. Blank = build current source."
        required: false
        type: string

concurrency:
  group: deploy-conversion
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # The plan's §3 is a promise about what this image does NOT contain, and a promise nothing
  # enforces is a promise that expires. This job is the enforcement: it fails the deploy if a
  # cloud-AI client, a GPU runtime or a local model framework ever lands in the dependency tree,
  # whether directly or pulled in by an extra somebody added to pyproject.toml.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Lint and unit tests
        working-directory: services/conversion
        run: |
          python -m pip install --quiet --upgrade pip
          # The lazily-imported heavyweights (markitdown, pdfplumber, pytesseract) are stubbed by
          # the tests, so the suite runs without the full image's dependency tree.
          python -m pip install --quiet pytest pydantic fastapi httpx boto3 ruff
          python -m ruff check .
          # tests/test_format_parity.py reads SourceFormats.cs, so this also fails when the C# and
          # Python allowlists drift apart.
          python -m pytest -q

      - name: Build the image
        run: docker build -t protofast-conversion:ci services/conversion

      - name: No LLM client, no cloud document AI, no GPU
        run: |
          set -euo pipefail
          packages="$(docker run --rm protofast-conversion:ci pip list --format=freeze)"

          # Named individually rather than by a pattern, so a new one has to be added here
          # deliberately and a reviewer sees it in the diff.
          for forbidden in openai anthropic torch torchvision transformers \
                           azure-ai-formrecognizer azure-ai-documentintelligence \
                           SpeechRecognition pydub youtube-transcript-api; do
            if printf '%s\n' "$packages" | grep -iq "^${forbidden}=="; then
              echo "FORBIDDEN dependency in the converter image: ${forbidden}" >&2
              echo "Conversion must stay local and CPU-only (ingest plan §3, §12.2)." >&2
              exit 1
            fi
          done

          # `markitdown[all]` would pull the first three in at once, which is the single easiest
          # way to violate §3 by accident.
          echo "no forbidden packages found"

          if docker run --rm protofast-conversion:ci test -d /usr/local/cuda; then
            echo "FORBIDDEN: the converter image contains a CUDA runtime" >&2
            exit 1
          fi
          echo "no CUDA runtime found"

      - name: Tesseract and Ghostscript are present and runnable
        run: |
          set -euo pipefail
          docker run --rm protofast-conversion:ci tesseract --version
          docker run --rm protofast-conversion:ci ocrmypdf --version

  deploy:
    needs: guard
    uses: ./.github/workflows/_component-deploy.yml
    with:
      component: conversion
      host: services
      # A Dockerfile component, cross-built for arm64 like envoy and the OTel collector.
      build: buildx
      target: protofast-conversion
      kind: service
      hash_paths: "services/conversion"
      project: services/conversion
      tag: ${{ inputs.tag }}
    secrets: inherit

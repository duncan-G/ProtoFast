# Generated by ProtoStrap.Hosting 0.1.4 from apphost/ProtoFast.AppHost.csproj.
# Do not edit: change the AppHost, then run `aspire do protostrap-spec`.
app: protofast
protostrap: 0.1.4

pools:
  ingress: { vm: t4g.small }
  general:
    vm: [t4g.medium]
    min: 1
    max: 4
    spare: 0
    target: 70%
    reserved: { cpu: 400m, memory: 1Gi }
  compute:
    vm: [t4g.small]
    min: 0
    max: 3
    spare: 0
    target: 85%
    reserved: { cpu: 400m, memory: 1Gi }
  data: { vm: t4g.medium, count: 1 }

cdn:
  waf:
    - { name: scanners, paths: [/wp-admin/, /wp-login.php, /xmlrpc.php, /.env, /.git/], action: block }
  cache:
    - { name: theplot-console, hosts: [admin], paths: [/theplot/], cache: false }
    - { name: keycloak, hosts: [auth], cache: false }

tunnel: {}

gateway:
  request: { cpu: 500m, memory: 256Mi }
  hosts:
    admin: admin.protofast.dev
    auth: auth.protofast.dev
    protofast: protofast.dev
    theplot: theplot.protofast.dev
  upstreams:
    api:
      routes:
        - protofast/document.
        - protofast/document_upload.
        - protofast/story.
        - theplot/document.
        - theplot/document_upload.
        - theplot/story.
        - admin/document.
        - admin/document_upload.
        - admin/story.
        - admin/admin.
      authorize:
        by: auth
        path: /ext-authz
        headers: [x-user-id, x-tenant, x-roles, x-internal-jwt, x-authenticated]
        forward: [cookie]
        respond: [set-cookie]
        open: true
        timeout: 500ms
    auth:
      routes:
        - protofast/signin
        - protofast/signup
        - protofast/signout
        - protofast/reset
        - protofast/add-passkey
        - protofast/account/
        - theplot/signin
        - theplot/signup
        - theplot/signout
        - theplot/reset
        - theplot/add-passkey
        - theplot/account/
        - admin/signin
        - admin/signup
        - admin/signout
        - admin/reset
        - admin/add-passkey
        - admin/account/
    clients:
      routes: [protofast/, theplot/, admin/]
      authorize:
        by: auth
        path: /ext-authz
        headers: [x-user-id, x-tenant, x-roles, x-internal-jwt, x-authenticated]
        forward: [cookie]
        respond: [set-cookie]
        open: true
        timeout: 500ms
        skip:
          - /assets/
          - "*.js"
          - "*.css"
          - "*.map"
          - "*.woff"
          - "*.woff2"
          - "*.ttf"
          - "*.otf"
          - "*.eot"
          - "*.png"
          - "*.jpg"
          - "*.jpeg"
          - "*.gif"
          - "*.svg"
          - "*.ico"
          - "*.webp"
          - "*.avif"
    clients-admin-theplot:
      routes: [admin/theplot/]
      authorize:
        by: auth
        path: /ext-authz
        headers: [x-user-id, x-tenant, x-roles, x-internal-jwt, x-authenticated]
        forward: [cookie]
        respond: [set-cookie]
        open: true
        timeout: 500ms
    keycloak:
      routes:
        - auth/realms/protofast/protocol/openid-connect/auth
        - auth/realms/protofast/protocol/openid-connect/logout
        - auth/realms/protofast/login-actions/
        - auth/realms/protofast/broker/
        - auth/realms/theplot/protocol/openid-connect/auth
        - auth/realms/theplot/protocol/openid-connect/logout
        - auth/realms/theplot/login-actions/
        - auth/realms/theplot/broker/
        - auth/realms/operators/protocol/openid-connect/auth
        - auth/realms/operators/protocol/openid-connect/logout
        - auth/realms/operators/login-actions/
        - auth/realms/operators/broker/
        - auth/resources/
    otel-collector:
      routes:
        - { route: protofast/otlp/, rate: 20/s }
        - { route: theplot/otlp/, rate: 20/s }
        - { route: admin/otlp/, rate: 20/s }
    payments:
      routes: [protofast/greet., theplot/greet., admin/greet.]
      authorize:
        by: auth
        path: /ext-authz
        headers: [x-user-id, x-tenant, x-roles, x-internal-jwt, x-authenticated]
        forward: [cookie]
        respond: [set-cookie]
        open: true
        timeout: 500ms

telemetry: {}

queues:
  document-upload: { visibility: 15m }
  workflow-outcomes: { fifo: true, visibility: 15m }

buckets:
  documents: { browser: true, versions: 7d, lock: true }

email:
  domains: [protofast.dev]

components:
  api:
    kind: service
    project: services/api/src/ProtoFast.Api/ProtoFast.Api.csproj
    sources:
      - Directory.Build.targets
      - global.json
      - nuget.config
      - services/api/src/ProtoFast.Api
      - services/api/src/ProtoFast.Data
      - services/document_import/src/ProtoFast.DocumentImport.Core
      - services/document_import/src/ProtoFast.DocumentImport.Data
      - services/document_import/src/ProtoFast.DocumentImport.Engine
      - services/document_import/src/ProtoFast.DocumentImport.Storage
      - services/shared/Database
      - services/shared/Database.Abstractions
      - services/shared/Exceptions
      - services/shared/Grpc
      - services/shared/ProtoStrap
      - services/shared/ServiceDefaults
      - services/shared/Storage
      - services/shared/Storage.Abstractions
    pool: general
    request: { cpu: 250m, memory: 512Mi }
    port: 8080
    ready: grpc
    depends_on: [postgres, redis]
    uses: [document-upload, documents]
    migrate: protofast-migrations
    env:
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "8080"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: in_memory
    secrets: [ConnectionStrings__protofast, ConnectionStrings__redis]
    stop: 30s
    scale: { min: 2, max: 4, demand: [{ cpu: 70% }] }

  auth:
    kind: service
    project: services/auth/src/ProtoFast.Auth.Api/ProtoFast.Auth.Api.csproj
    sources:
      - Directory.Build.targets
      - global.json
      - nuget.config
      - services/auth/src/ProtoFast.Auth.Api
      - services/auth/src/ProtoFast.Auth.Data
      - services/shared/ProtoStrap
      - services/shared/ServiceDefaults
    pool: general
    request: { cpu: 250m, memory: 256Mi }
    port: 8080
    ready: /healthz
    depends_on: [keycloak, postgres, redis]
    uses: [email]
    migrate: auth-migrations
    env:
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "8080"
      Keycloak__Authority: http://keycloak:8080
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: in_memory
    secrets:
      - ConnectionStrings__auth
      - ConnectionStrings__redis
      - Keycloak__AdminClientSecret
      - Keycloak__ClientSecretAdmin
      - Keycloak__ClientSecretProtofastWeb
      - Keycloak__ClientSecretTheplotWeb
    stop: 20s
    scale: { min: 2, max: 4, demand: [{ cpu: 70% }] }

  auth-migrations:
    kind: task
    project: services/auth/src/ProtoFast.Auth.SchemaMigrations/ProtoFast.Auth.SchemaMigrations.csproj
    sources:
      - Directory.Build.targets
      - global.json
      - nuget.config
      - services/auth/src/ProtoFast.Auth.Data
      - services/auth/src/ProtoFast.Auth.SchemaMigrations
      - services/shared/ProtoStrap
    pool: general
    request: { cpu: 100m, memory: 128Mi }
    depends_on: [postgres]
    env:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: in_memory
    secrets: [ConnectionStrings__auth]

  clients:
    kind: service
    build: clients
    sources:
      - ":(exclude,glob)clients/**/*.md"
      - ":(exclude,glob)clients/**/*.md/**"
      - ":(exclude,glob)clients/**/*.spec.ts"
      - ":(exclude,glob)clients/**/*.spec.ts/**"
      - ":(exclude,glob)clients/**/.angular"
      - ":(exclude,glob)clients/**/.angular/**"
      - ":(exclude,glob)clients/**/.cursor"
      - ":(exclude,glob)clients/**/.cursor/**"
      - ":(exclude,glob)clients/**/.vscode"
      - ":(exclude,glob)clients/**/.vscode/**"
      - ":(exclude,glob)clients/**/coverage"
      - ":(exclude,glob)clients/**/coverage/**"
      - ":(exclude,glob)clients/**/dist"
      - ":(exclude,glob)clients/**/dist/**"
      - ":(exclude,glob)clients/**/node_modules"
      - ":(exclude,glob)clients/**/node_modules/**"
      - ":(exclude,glob)clients/host/*.test.mjs"
      - ":(exclude,glob)clients/host/*.test.mjs/**"
    pool: general
    request: { cpu: 250m, memory: 512Mi }
    port: 4000
    ready: /healthz
    env:
      ADMIN_CONSOLE_ROLES: "*"
      CLIENTS: admin,protofast,theplot
      DEFAULT_CLIENT: protofast
    stop: 20s
    scale: { min: 2, max: 4, demand: [{ cpu: 70% }] }

  clients-admin-theplot:
    kind: service
    build: clients
    sources:
      - ":(exclude,glob)clients/**/*.md"
      - ":(exclude,glob)clients/**/*.md/**"
      - ":(exclude,glob)clients/**/*.spec.ts"
      - ":(exclude,glob)clients/**/*.spec.ts/**"
      - ":(exclude,glob)clients/**/.angular"
      - ":(exclude,glob)clients/**/.angular/**"
      - ":(exclude,glob)clients/**/.cursor"
      - ":(exclude,glob)clients/**/.cursor/**"
      - ":(exclude,glob)clients/**/.vscode"
      - ":(exclude,glob)clients/**/.vscode/**"
      - ":(exclude,glob)clients/**/coverage"
      - ":(exclude,glob)clients/**/coverage/**"
      - ":(exclude,glob)clients/**/dist"
      - ":(exclude,glob)clients/**/dist/**"
      - ":(exclude,glob)clients/**/node_modules"
      - ":(exclude,glob)clients/**/node_modules/**"
      - ":(exclude,glob)clients/host/*.test.mjs"
      - ":(exclude,glob)clients/host/*.test.mjs/**"
    pool: general
    request: { cpu: 100m, memory: 256Mi }
    port: 4000
    ready: /healthz
    env:
      ADMIN_CONSOLE_ROLES: admin-theplot
      CLIENTS: admin-theplot
      DEFAULT_CLIENT: admin-theplot
    stop: 20s

  conversion:
    kind: service
    build: services/conversion
    sources:
      - ":(exclude,glob)services/conversion/**/*.egg-info"
      - ":(exclude,glob)services/conversion/**/*.egg-info/**"
      - ":(exclude,glob)services/conversion/**/*.pyc"
      - ":(exclude,glob)services/conversion/**/*.pyc/**"
      - ":(exclude,glob)services/conversion/**/__pycache__"
      - ":(exclude,glob)services/conversion/**/__pycache__/**"
      - ":(exclude,glob)services/conversion/.dockerignore"
      - ":(exclude,glob)services/conversion/.dockerignore/**"
      - ":(exclude,glob)services/conversion/.env"
      - ":(exclude,glob)services/conversion/.env/**"
      - ":(exclude,glob)services/conversion/.gitignore"
      - ":(exclude,glob)services/conversion/.gitignore/**"
      - ":(exclude,glob)services/conversion/.pytest_cache"
      - ":(exclude,glob)services/conversion/.pytest_cache/**"
      - ":(exclude,glob)services/conversion/.ruff_cache"
      - ":(exclude,glob)services/conversion/.ruff_cache/**"
      - ":(exclude,glob)services/conversion/.venv"
      - ":(exclude,glob)services/conversion/.venv/**"
      - ":(exclude,glob)services/conversion/README.md"
      - ":(exclude,glob)services/conversion/README.md/**"
      - ":(exclude,glob)services/conversion/build"
      - ":(exclude,glob)services/conversion/build/**"
      - ":(exclude,glob)services/conversion/dist"
      - ":(exclude,glob)services/conversion/dist/**"
      - ":(exclude,glob)services/conversion/pyproject.toml"
      - ":(exclude,glob)services/conversion/pyproject.toml/**"
      - ":(exclude,glob)services/conversion/tests"
      - ":(exclude,glob)services/conversion/tests/**"
      - ":(exclude,glob)services/conversion/venv"
      - ":(exclude,glob)services/conversion/venv/**"
    pool: compute
    request: { cpu: 1000m, memory: 1Gi }
    port: 8090
    ready: /healthz
    uses: [documents]
    stop: 620s
    scale: { min: 1, max: 4, demand: [{ cpu: 70% }] }

  document-import:
    kind: worker
    project: services/document_import/src/ProtoFast.DocumentImport.Worker/ProtoFast.DocumentImport.Worker.csproj
    sources:
      - Directory.Build.targets
      - global.json
      - nuget.config
      - services/api/src/ProtoFast.Data
      - services/document_import/src/ProtoFast.DocumentImport.Core
      - services/document_import/src/ProtoFast.DocumentImport.Data
      - services/document_import/src/ProtoFast.DocumentImport.Engine
      - services/document_import/src/ProtoFast.DocumentImport.Screenplay
      - services/document_import/src/ProtoFast.DocumentImport.Storage
      - services/document_import/src/ProtoFast.DocumentImport.Worker
      - services/shared/Database
      - services/shared/Database.Abstractions
      - services/shared/ProtoStrap
      - services/shared/ServiceDefaults
      - services/shared/Storage
      - services/shared/Storage.Abstractions
    pool: compute
    request: { cpu: 500m, memory: 512Mi }
    depends_on: [postgres]
    uses: [documents, workflow-outcomes]
    migrate: protofast-migrations
    env:
      Conversion__BaseUrl: http://conversion:8090
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: in_memory
    secrets: [ConnectionStrings__protofast]
    stop: 45s
    scale: { min: 0, max: 4, demand: [{ queue: document-upload, rate: 0.016666667/s, drain: 10m }] }

  keycloak:
    kind: service
    build: services/keycloak
    sources:
      - ":(exclude,glob)services/keycloak/**/target"
      - ":(exclude,glob)services/keycloak/**/target/**"
      - ":(exclude,glob)services/keycloak/README.md"
      - ":(exclude,glob)services/keycloak/README.md/**"
      - ":(exclude,glob)services/keycloak/test"
      - ":(exclude,glob)services/keycloak/test/**"
    pool: general
    request: { cpu: 500m, memory: 1Gi }
    port: 8080
    ready: 9000/health/ready
    depends_on: [postgres]
    uses: [email]
    configure: keycloak-config
    env:
      KC_BOOTSTRAP_ADMIN_CLIENT_ID: protofast-admin
    secrets: [ConnectionStrings__keycloak, KC_BOOTSTRAP_ADMIN_CLIENT_SECRET]
    secret_files: true
    stop: 30s

  keycloak-config:
    kind: task
    build: services/keycloak-config
    sources:
      - ":(exclude,glob)services/keycloak-config/README.md"
      - ":(exclude,glob)services/keycloak-config/README.md/**"
      - ":(exclude,glob)services/keycloak-config/test"
      - ":(exclude,glob)services/keycloak-config/test/**"
    pool: general
    request: { cpu: 250m, memory: 512Mi }
    depends_on: [keycloak]
    env:
      AUTH_URL: http://auth:8080
      KC_BOOTSTRAP_ADMIN_CLIENT_ID: protofast-admin
      KEYCLOAK_URL: http://keycloak:8080
    secrets:
      - KC_BOOTSTRAP_ADMIN_CLIENT_SECRET
      - Keycloak__AdminClientSecret
      - Keycloak__ClientSecretAdmin
      - Keycloak__ClientSecretProtofastWeb
      - Keycloak__ClientSecretTheplotWeb
    secret_prefix: Keycloak_
    secret_files: true

  otel-collector:
    kind: service
    build: services/otel-collector
    sources:
      - ":(exclude,glob)services/otel-collector/.dockerignore"
      - ":(exclude,glob)services/otel-collector/.dockerignore/**"
      - ":(exclude,glob)services/otel-collector/README.md"
      - ":(exclude,glob)services/otel-collector/README.md/**"
    pool: general
    request: { cpu: 100m, memory: 128Mi }
    port: 4318
    ready: 13133/
    stop: 15s

  payments:
    kind: service
    project: services/payments/src/ProtoFast.Payments.Api/ProtoFast.Payments.Api.csproj
    sources:
      - Directory.Build.targets
      - global.json
      - nuget.config
      - services/payments/src/ProtoFast.Payments.Api
      - services/shared/ProtoStrap
      - services/shared/ServiceDefaults
    pool: general
    request: { cpu: 100m, memory: 128Mi }
    port: 8080
    ready: grpc
    env:
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "8080"
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: in_memory
    stop: 15s

  postgres:
    kind: stateful
    image: postgres:18.3
    vm: data-1
    request: { cpu: 1000m, memory: 1Gi }
    port: 5432
    configure: postgres-config
    env:
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    secrets: [POSTGRES_PASSWORD]
    secret_files: true
    on_secret_change:
      - sh
      - -c
      - printf '%s\n' '\set pw `cat /run/secrets/POSTGRES_PASSWORD`' "ALTER ROLE postgres PASSWORD :'pw';" | psql -X -q -v ON_ERROR_STOP=1 -U postgres -d postgres
    stop: 1m
    volume: { path: /var/lib/postgresql, size: 20Gi }
    backup: [pg_dumpall, -U, postgres]

  postgres-config:
    kind: task
    project: services/postgres_config/src/ProtoFast.PostgresConfig/ProtoFast.PostgresConfig.csproj
    sources:
      - Directory.Build.targets
      - global.json
      - nuget.config
      - services/postgres_config/src/ProtoFast.PostgresConfig
      - services/shared/ProtoStrap
    pool: general
    request: { cpu: 100m, memory: 128Mi }
    depends_on: [postgres]
    env:
      Databases__Names: keycloak,auth,protofast
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: in_memory
    secrets:
      - ConnectionStrings__auth
      - ConnectionStrings__keycloak
      - ConnectionStrings__postgres
      - ConnectionStrings__protofast

  protofast-migrations:
    kind: task
    project: services/api/src/ProtoFast.SchemaMigrations/ProtoFast.SchemaMigrations.csproj
    sources:
      - Directory.Build.targets
      - global.json
      - nuget.config
      - services/api/src/ProtoFast.Data
      - services/api/src/ProtoFast.SchemaMigrations
      - services/document_import/src/ProtoFast.DocumentImport.Core
      - services/document_import/src/ProtoFast.DocumentImport.Data
      - services/document_import/src/ProtoFast.DocumentImport.Engine
      - services/document_import/src/ProtoFast.DocumentImport.Storage
      - services/shared/Database
      - services/shared/Database.Abstractions
      - services/shared/ProtoStrap
      - services/shared/Storage
      - services/shared/Storage.Abstractions
    pool: general
    request: { cpu: 100m, memory: 256Mi }
    depends_on: [postgres]
    env:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: in_memory
    secrets: [ConnectionStrings__protofast]

  redis:
    kind: stateful
    image: redis:8.6
    command:
      - sh
      - -c
      - exec docker-entrypoint.sh redis-server --requirepass "$(cat /run/secrets/REDIS_PASSWORD)" --maxmemory 256mb --maxmemory-policy volatile-ttl --save '' --appendonly no
    vm: data-1
    request: { cpu: 250m, memory: 512Mi }
    port: 6379
    secrets: [REDIS_PASSWORD]
    secret_files: true
    on_secret_change:
      - sh
      - -c
      - for f in /run/secrets/REDIS_PASSWORD /run/secrets/previous/REDIS_PASSWORD; do [ -f "$f" ] && REDISCLI_AUTH="$(cat "$f")" redis-cli --no-auth-warning -x CONFIG SET requirepass </run/secrets/REDIS_PASSWORD | grep -qx OK && exit 0; done; exit 1
    volume: { path: /data, size: 1Gi }
    backup: [sh, -c, REDISCLI_AUTH="$(cat /run/secrets/REDIS_PASSWORD)" exec redis-cli --no-auth-warning --rdb -]

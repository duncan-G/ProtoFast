# Copy for the two code pages this JAR ships. Merged into every theme's login
# bundle, so a theme can still override any of these by declaring the same key.
#
# Every apostrophe is DOUBLED: Keycloak runs each message through
# java.text.MessageFormat whether or not it takes arguments, and a lone ' is
# MessageFormat's quote character — it would swallow the rest of the sentence.

# ── Sign-in by code ─────────────────────────────────────────────────────────
pfOtpSignInTitle=Check your email
pfOtpSignInSubtitle=We sent a sign-in code to {0}.
pfOtpSubmit=Sign in

# ── Verify an address at sign-up ────────────────────────────────────────────
pfOtpVerifyTitle=Confirm your email
pfOtpVerifySubtitle=We sent a code to {0}. Enter it here to finish creating your account.
pfOtpVerifySubmit=Confirm email

# ── Shared ──────────────────────────────────────────────────────────────────
pfOtpLabel=Verification code
pfOtpHelp=Six digits. The code expires in 10 minutes and can be used once.
pfOtpResend=Send another code
pfOtpResendWait=You can ask for another code in {0} seconds.

# ── Things that went wrong ──────────────────────────────────────────────────
# Deliberately specific: a code that has expired, a code that was mistyped and a
# code that no longer exists all need different next steps from the user.
pfOtpInvalid=That code is not right. Check it and try again.
pfOtpExpired=That code has expired. Ask for a new one.
pfOtpExhausted=Too many wrong codes. That code is no longer valid — ask for a new one.
pfOtpNoCode=There is no code to check. Ask for a new one.
pfOtpCooldown=A code is already on its way. You can ask for another in {0} seconds.
pfOtpSendLimit=We''ve sent all the codes we can for this attempt. Start again to get a new one.
pfOtpNoAddress=This account has no email address, so we can''t send a code. Contact support.
pfOtpMailFailed=We couldn''t send the code. Try again in a moment.

# ── Credential chooser ──────────────────────────────────────────────────────
# The label and hint on "Try another way", which is now a real user path: a
# passkey holder signing in on a device that does not have their passkey.
email-otp-display-name=Email code
email-otp-help-text=Get a single-use code by email.

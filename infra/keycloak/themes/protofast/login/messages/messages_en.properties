loginAccountTitle=Sign in
loginTitleHtml=Protofast
# Base gives `loginTitle=Sign in to {0}` with {0} = realm.displayName. The realm
# sets that too, but --import-realm skips realms that already exist, so an
# established deployment would keep rendering "Sign in to ". This theme only
# ever serves the protofast realm, so name it here and stop depending on it.
loginTitle=Sign in to Protofast
doLogIn=Sign in
registerTitle=Create your account
doRegister=Create account
noAccount=Don''t have an account?
backToLogin=« Back to sign in

# The credential chooser. It is reached from the passkey prompt and is the way
# out of a real dead end — a passkey holder on a device that does not have their
# passkey — so it is worded as an offer rather than as a fallback.
loginChooseAuthenticator=Choose how to sign in
doTryAnotherWay=Sign in another way

# The username step. There is no password field under it any more, so the button
# no longer promises to sign anyone in on its own.
doContinue=Continue

# Base's wording for the passkey prompt assumes a security key on a lanyard.
webauthn-login-title=Sign in with your passkey
webauthn-registration-title=Add a passkey
webauthn-doAuthenticate=Use passkey

# The passkey sign-in page. It opens the browser prompt on load, so the waiting
# copy is what a user normally sees and the resting copy below is for a browser
# that will not open a prompt without a click first (Safari). Its own keys rather
# than the registration ones: this asks for a passkey the user already has, and
# promises to sign them in rather than to save anything.
webauthn-login-body=Your browser will ask for your face, fingerprint or device PIN — the passkey you saved for Protofast.
webauthn-login-waiting-title=Waiting for your device
webauthn-login-waiting-body=Confirm with Face ID, Touch ID or your device PIN and we''ll sign you in.
webauthn-login-waiting-cta=Waiting for confirmation

# The passkey setup page. Base labels its primary action "Register security key"
# and says nothing else on the page; these name the thing the user is actually
# about to do and explain it before the browser prompt takes over the screen.
doRegisterSecurityKey=Use this device
webauthn-registration-body=Your browser will ask for your face, fingerprint or device PIN. That becomes your sign-in for this device: no code, no password.
# Shown while the browser prompt is open. It deliberately does not promise to
# send anyone back to the account page — this page is also the last step of a
# first sign-in, where there is no account page to go back to yet.
webauthn-registration-waiting-title=Waiting for your device
webauthn-registration-waiting-body=Confirm with Face ID, Touch ID or your device PIN. We''ll take it from there.
webauthn-registration-waiting-cta=Waiting for confirmation
webauthn-registration-privacy=Your passkey stays on this device. We never see it.

# Naming the passkey, once it exists. Base does this in a window.prompt(); this
# theme's copy of webauthnRegister.js puts it on the card instead, so these are
# page copy rather than dialog copy. The title and body replace the ones above.
webauthn-registration-named-title=Passkey saved
webauthn-registration-named-body=Give it a name so you can tell it apart from your other passkeys later.
webauthn-registration-label-field=Passkey name
webauthn-registration-label-help=You can rename it any time from your account.
webauthn-registration-label-save=Done

# Overrides base's "Passkey (Default Label)". Only reached when the credential
# tells us nothing at all: no AAGUID we recognise, no transports, no attachment.
webauthn-registration-init-label=My passkey

# The suggested name, when the AAGUID does not resolve to a passkey provider.
# These name a *kind* of device on purpose. WebAuthn exposes no device name —
# a name the user gave their own machine would be a fingerprinting surface, so
# nothing in the credential or the browser carries one. The first seven are the
# operating system the browser runs on, which for a platform authenticator is
# the same machine the passkey was saved to; the last three are all the
# credential's transports are willing to say.
webauthn-registration-device-windows=Windows PC
webauthn-registration-device-mac=Mac
webauthn-registration-device-iphone=iPhone
webauthn-registration-device-ipad=iPad
webauthn-registration-device-android=Android device
webauthn-registration-device-chromeos=Chromebook
webauthn-registration-device-linux=Linux PC
webauthn-registration-device-this=This device
webauthn-registration-device-phone=Phone or tablet
webauthn-registration-device-securitykey=Security key

# The way out of the passkey offer. Its own key rather than base's doCancel:
# that key is shared with every other base page that has a cancel button, and
# the wording here belongs to this offer alone.
doSkipPasskey=Cancel

# Cancelling the browser passkey prompt rejects navigator.credentials.create()
# with NotAllowedError. Base interpolates that DOMException as {0} on
# webauthn-error-register-verification, so the user sees "Passkey registration
# result is invalid. NotAllowedError: The request is not allowed…". Drop the
# placeholder — Keycloak still logs the technical detail server-side.
webauthn-error-title=Couldn''t use a passkey
webauthn-error-register-verification=Passkey setup was cancelled or didn''t complete. You can try again when you''re ready.
webauthn-error-registration=We couldn''t add a passkey. You can try again, or cancel for now.
webauthn-error-api-get=We couldn''t sign in with a passkey. Try again, or sign in another way.
webauthn-error-auth-verification=We couldn''t sign in with a passkey. Try again, or sign in another way.

# The realm has no passwords: the reset-credentials flow is unbound and
# resetPasswordAllowed is off, so nothing renders a "Forgot password?" link.
# These keys stay because base's own templates still resolve them, and they are
# worded so that an unexpected route into one is not actively misleading.
updatePasswordTitle=Set a password
updatePasswordMessage=This account does not use a password. If you reached this page, something is misconfigured — go back and sign in with a passkey or an emailed code.
passwordNew=Password

# Registration rejects an email that already has an account. Every account is now
# reachable from the sign-in form — a passkey, a linked Google or Apple account, or
# a code to this very address — so the honest next step is to go there rather than
# a dead end. register.ftl turns this exact message (and only this one) into a
# link; the href has to come from the template because the sign-in URL belongs to
# the running authentication session and cannot be written down here.
emailExistsMessage=That email is already registered.
emailExistsSignIn=Sign in instead — we''ll email you a code if you don''t have a passkey.

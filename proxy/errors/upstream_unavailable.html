<!doctype html>
<!--
  Envoy's local reply for an unreachable upstream (see the `local_reply_config`
  mappers in ../envoy.listener.yaml.tmpl). Wired in by filename, so it must stay
  a single self-contained file — Envoy serves these bytes verbatim as the whole
  response body, with no server around it to resolve a stylesheet or an image.

  Styled in Nocturne, the same design system as the app
  (clients/protofast/src/styles/nocturne.css) and the Keycloak login theme
  (deploy/keycloak/themes/protofast/login/resources/css/styles.css). As in the
  Keycloak theme, the token block is a verbatim copy of Nocturne's `:root`;
  when the system is retuned there, re-copy it here.

  One deliberate deviation from those two: no Google Fonts <link>. Inter is
  Nocturne's --font-body, but this page renders precisely when the platform is
  already degraded, and a render-blocking third-party stylesheet is the wrong
  trade here. Inter is requested locally and falls back to the system stack.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Temporarily unavailable</title>
    <style>
      /* ── Nocturne tokens (verbatim from nocturne.css `:root`) ─────────── */
      :root {
        --color-bg: #161826;
        --color-surface: #232532;
        --color-text: #e9e9ed;
        --color-accent: #9184d9;
        --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);

        --color-neutral-400: #b2b6ca;
        --color-neutral-500: #9397ab;
        --color-neutral-600: #75798c;

        --color-accent-600: #796cbf;
        --color-accent-700: #5d5294;
        --color-accent-800: #423a6a;

        --font-heading: "Inter", system-ui, sans-serif;
        --font-heading-weight: 500;
        --font-body: "Inter", system-ui, sans-serif;

        --space-1: 2.8px;
        --space-2: 5.6px;
        --space-3: 8.4px;
        --space-4: 11.2px;
        --space-6: 16.8px;
        --space-8: 22.4px;

        --radius-md: 8px;
        --radius-lg: 14px;

        --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0, 0, 0, 0.55);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-body);
        font-size: 15px;
        line-height: 1.55;
        font-weight: 400;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* Accent as a bloom, not a flood — the same radial the landing page's
         closing CTA and the login card sit under. */
      .pf-glow {
        position: fixed;
        inset: 0;
        background: radial-gradient(
          62rem 36rem at 50% -6rem,
          color-mix(in srgb, var(--color-accent) 16%, transparent),
          transparent 70%
        );
        pointer-events: none;
        z-index: 0;
      }

      .pf-page {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-8);
        min-height: 100vh;
        min-height: 100dvh;
        padding: 3rem 1.5rem;
      }

      /* ── Brand ─────────────────────────────────────────────────────────
         The swarm lockup, path data copied from the app's
         shared/protofast-logo.ts by way of the Keycloak template. Not a link:
         the origin behind this page is the thing that is down. */
      .pf-brand {
        display: inline-flex;
        align-items: center;
        gap: 0.5em;
        font-family: var(--font-heading);
        font-weight: var(--font-heading-weight);
        font-size: 17px;
        letter-spacing: -0.02em;
        color: var(--color-text);
      }
      .pf-brand-mark {
        display: block;
        width: 1.5em;
        height: 1.5em;
        flex: none;
      }

      /* ── Card ──────────────────────────────────────────────────────────
         Flush-left contents, per the system's direction — not centred. */
      .pf-card {
        width: min(27.5rem, 100%);
        padding: var(--space-8) calc(var(--space-8) * 1.2);
        background: var(--color-surface);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-md);
      }

      /* Nocturne's `.card-kicker`, with the status glyph on the same line.
         Short accent marks stay solid — only freestanding rules fade. */
      .pf-kicker {
        display: flex;
        align-items: center;
        gap: var(--space-2);
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--color-accent);
      }
      .pf-kicker svg {
        display: block;
        width: 14px;
        height: 14px;
        flex: none;
      }

      .pf-title {
        margin: var(--space-4) 0 0;
        font-family: var(--font-heading);
        font-weight: var(--font-heading-weight);
        font-size: 1.625rem;
        line-height: 1.12;
        letter-spacing: -0.02em;
      }
      .pf-body {
        margin: var(--space-3) 0 0;
        max-width: 34ch;
        font-size: 14px;
        color: var(--color-neutral-400);
      }

      .pf-actions {
        margin-top: var(--space-8);
      }

      /* Nocturne outlines its primary action — an accent border on
         transparent, never a filled accent. Do not "fix" this into a solid
         button. */
      .pf-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        cursor: pointer;
        font-family: var(--font-heading);
        font-weight: var(--font-heading-weight);
        font-size: 14px;
        line-height: 1.2;
        color: var(--color-accent);
        background: transparent;
        border: 1px solid var(--color-accent);
        padding: var(--space-2) calc(var(--space-3) * 1.2);
        border-radius: var(--radius-md);
      }
      .pf-btn:hover {
        background: color-mix(in srgb, var(--color-accent) 12%, transparent);
      }
      .pf-btn:active {
        background: color-mix(in srgb, var(--color-accent) 22%, transparent);
      }

      /* Nocturne rules fade to transparent at both ends rather than stopping
         cleanly — painted as a background strip so the fade spans the full
         width of the card's content box. */
      .pf-meta {
        margin-top: var(--space-8);
        padding-top: var(--space-6);
        font-size: 13px;
        color: var(--color-neutral-500);
        background: linear-gradient(
            to right,
            transparent,
            var(--color-divider) 48px,
            var(--color-divider) calc(100% - 48px),
            transparent
          )
          no-repeat top / 100% 1px;
      }

      /* Themed interaction states, never the browser defaults. */
      :focus {
        outline: none;
      }
      :focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 2px;
      }
      ::selection {
        background: color-mix(in srgb, var(--color-accent) 30%, transparent);
      }
    </style>
  </head>
  <body>
    <div class="pf-glow" aria-hidden="true"></div>

    <div class="pf-page">
      <span class="pf-brand">
        <svg class="pf-brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <g stroke-width="2.8" stroke-linecap="round">
            <path d="M5 6 H13" stroke="var(--color-accent-800)" />
            <path d="M5 11 H16" stroke="var(--color-accent-700)" />
            <path d="M5 16 H19" stroke="var(--color-accent-600)" />
            <path d="M5 21 H16" stroke="var(--color-accent-700)" />
            <path d="M5 26 H13" stroke="var(--color-accent-800)" />
          </g>
          <circle cx="25" cy="16" r="4" fill="var(--color-accent)" />
        </svg><span>Protofast</span>
      </span>

      <main class="pf-card" role="alert" aria-live="polite">
        <p class="pf-kicker">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 9v4" />
            <path d="M12 17h.01" />
            <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z" />
          </svg>
          Service unavailable
        </p>
        <h1 class="pf-title">We&rsquo;ll be right back</h1>
        <p class="pf-body">
          One of our services is briefly unreachable. This is usually temporary
          — please try again in a moment.
        </p>
        <div class="pf-actions">
          <button class="pf-btn" type="button" onclick="location.reload()">Retry</button>
        </div>
        <p class="pf-meta">If the problem persists, please contact support.</p>
      </main>
    </div>
  </body>
</html>

# Copy for the emails this realm sends.
#
# Two conventions here, both load-bearing:
#
# 1. The pf* keys hold PLAIN TEXT, never markup. Base keeps whole HTML fragments
#    in *BodyHtml keys and pipes them through kcSanitize; this theme builds the
#    markup in html/*.ftl instead, so the copy stays one sentence per key and the
#    same key feeds both the HTML part and the text/plain alternative. Anything
#    written here is auto-escaped on the way into the HTML, so `<`, `&` and
#    friends are safe but tags will not render.
# 2. Every apostrophe is DOUBLED. Keycloak runs each message through
#    java.text.MessageFormat whether or not it takes arguments, and a lone ' is
#    MessageFormat's quote character — it would swallow the rest of the sentence.
#
# The base *BodyHtml / *Body keys these replace are left at their inherited
# values on purpose: the emails this theme does not override (org invites,
# identity-provider links, the event-* security notices) still use them, and
# they render inside this theme's shell.

# ── Subjects ────────────────────────────────────────────────────────────────
# Deliberately not prefixed with the product name where the sentence already
# carries it — the From display name is "Protofast" on every one of these.
emailVerificationSubject=Verify your email address
passwordResetSubject=Set your Protofast password
executeActionsSubject=Your Protofast account needs an update
emailUpdateConfirmationSubject=Confirm your new email address
emailTestSubject=Protofast SMTP test

# ── Shared ──────────────────────────────────────────────────────────────────
pfLinkExpires=This link expires in {0}.
pfFallbackIntro=Trouble with the button? Paste this link into your browser:
pfFooterSentTo=Sent to {0}.
pfFooterTagline=Built fast, obviously.

# ── Verify email (sign-up) ──────────────────────────────────────────────────
# registration-password-action defers the password until after verification, so
# an unverified account genuinely has no credential behind it. Saying that is
# the honest reassurance for someone who did not sign up.
pfVerifyHeading=Verify your email
pfVerifyPreheader=Confirm this address to finish creating your account.
pfVerifyLead=Someone created a {0} account with this email address. Confirm it''s yours and we''ll finish setting it up.
pfVerifyAction=Verify email address
pfVerifyIgnore=If you didn''t sign up, ignore this message. The account has no password yet and can''t be used until this address is confirmed.

# ── Set / reset password ────────────────────────────────────────────────────
# Sent by "Forgot password?" AND by the browser flow's finish-account-setup
# branch, so it has to read correctly for a first password and for a change.
pfResetHeading=Set your password
pfResetPreheader=A link to set the password on your Protofast account.
pfResetLead=Someone asked for a link to set the password on the {0} account at this address. You''ll also get this if you started signing up and never finished — the link picks up where you left off.
pfResetAction=Set your password
pfResetIgnore=If you didn''t ask for this, ignore this message. Nothing changes until you follow the link, and your current password — if you have one — keeps working.

# ── Admin-requested required actions ────────────────────────────────────────
pfActionsHeading=Update your account
pfActionsPreheader=Something is waiting on your Protofast account.
pfActionsLead=An administrator has asked you to complete the following on your {0} account: {1}.
pfActionsAction=Update account
pfActionsIgnore=If you weren''t expecting this, ignore this message and nothing changes.

# ── Confirm a new email address ─────────────────────────────────────────────
# Lands in the NEW inbox, which may have no idea what Protofast is — so it names
# both the product and the address being confirmed.
pfEmailUpdateHeading=Confirm your new address
pfEmailUpdatePreheader=Confirm this address to use it on your Protofast account.
pfEmailUpdateLead=Confirm {1} to start using it as the email address on your {0} account.
pfEmailUpdateAction=Confirm this address
pfEmailUpdateIgnore=If you didn''t ask to change your email address, ignore this message and the account keeps the one it has.

# ── Verify email by code ────────────────────────────────────────────────────
pfVerifyCodePreheader=Your verification code.
pfVerifyCodeLead=Enter this code to confirm your email address for {0}:
pfVerifyCodeIgnore=The code is single use. If you didn''t ask for it, ignore this message.

# ── SMTP test ───────────────────────────────────────────────────────────────
pfTestHeading=SMTP is working
pfTestPreheader=Test message from the Protofast realm.
pfTestLead=This is the test message from the {0} realm''s SMTP settings. It arrived, so Keycloak can send mail.
pfTestNote=It renders through the protofast email theme too — so if this looks like Protofast, the theme is loading as well.

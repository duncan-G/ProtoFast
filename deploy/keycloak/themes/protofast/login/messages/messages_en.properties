loginAccountTitle=Sign in
loginTitleHtml=Protofast
# Base gives `loginTitle=Sign in to {0}` with {0} = realm.displayName. The realm
# sets that too, but --import-realm skips realms that already exist, so an
# established deployment would keep rendering "Sign in to ". This theme only
# ever serves the protofast realm, so name it here and stop depending on it.
loginTitle=Sign in to Protofast
doLogIn=Sign in
registerTitle=Create your account
doRegister=Create account
noAccount=Don''t have an account?
backToLogin=\u00AB Back to sign in
emailForgotTitle=Reset your password
doForgotPassword=Forgot password?

# The update-password page is reached two ways, and Keycloak uses a different
# message key for each — so they can be worded independently:
#   updatePasswordMessage - the UPDATE_PASSWORD required action. Here that only
#     ever fires at sign-up: registration-password-action defers the password to
#     after email verification (its always_set_password_on_register_form defaults
#     to false when the realm has verifyEmail), so the user is creating a first
#     password, not changing one. Base wording ("You need to change your password
#     to activate your account.") is wrong for that.
#   resetPasswordMessage - the forgot-password flow, where "change" is accurate;
#     left at the base wording.
# updatePasswordTitle is shared by both pages, so it has to read correctly either
# way — "Set" works for a first password and for a reset; "Update" does not.
updatePasswordTitle=Set your password
updatePasswordMessage=Choose a password to finish setting up your account.
# Shared by both of those pages too. "New Password" is right for a reset but wrong
# at sign-up, where there is no old password; "Password" reads correctly either way.
passwordNew=Password

# Registration rejects an email that already has an account, and that account is
# often only half-built: registration-password-action creates the user with no
# credential, so anyone who abandons sign-up at the verify-email or set-password
# step leaves one behind. Base wording ("Email already exists.") reads as a dead
# end. Point at sign-in instead — the browser flow's "finish account setup"
# branch emails those accounts a link to pick up where they left off.
emailExistsMessage=That email is already registered. Sign in instead — if you never finished signing up, we''ll email you a link to pick up where you left off.

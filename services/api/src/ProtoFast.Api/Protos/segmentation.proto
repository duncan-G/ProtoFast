syntax = "proto3";

option csharp_namespace = "ProtoFast.Api";

package segmentation;

// Document segmentation: submit a document, follow the run, read the tree.
//
// This is a second gRPC service inside `api`, next to Greeter, so it inherits everything api
// already has: the InternalJwtAuthInterceptor on every call, AddServiceDefaults() telemetry, the
// gRPC health service, and the edge's /api/ route with its ext_authz annotation. No Envoy change
// is required — /api/ already strips its prefix and has no timeout, which is what a long-lived
// status stream needs.
//
// Every RPC is authorized by the internal JWT and every run is scoped to its subject: ownership
// comes from the token, never from a request field.
service Segmentation {
  // Returns a presigned S3 POST (url + form fields). The browser uploads directly to S3, so a
  // large document never crosses gRPC and api never sees the bytes. POST rather than PUT because
  // only a POST policy can carry a content-length-range condition — which is what makes the size
  // limit S3's to enforce rather than the browser's to respect.
  rpc CreateUpload (CreateUploadRequest) returns (CreateUploadReply);

  // The formats ThePlot can read and the size cap, so the upload page's accept list and its error
  // messages come from the same place the validation does.
  rpc ListSourceFormats (ListSourceFormatsRequest) returns (ListSourceFormatsReply);

  // Validates the upload, writes the run row, sends one SQS message. Idempotent on
  // idempotency_key: the same key returns the same run rather than a second run and a second bill.
  rpc SubmitRun (SubmitRunRequest) returns (SubmitRunReply);

  rpc GetRun (GetRunRequest) returns (Run);

  // Server-streaming tail of run_events, so ThePlot shows progress without polling.
  rpc WatchRun (GetRunRequest) returns (stream RunEvent);

  rpc GetResult (GetRunRequest) returns (Result);

  // The scene stream of a published run (scene plan §10, milestone S7): scenes over items, with
  // every item's text resolved server-side and every persona and place already named. A renderer
  // reads a scene from its own record and never asks for the document (K1), which is why the
  // resolution happens here rather than being left as a join for each client to repeat.
  rpc GetScenes (GetScenesRequest) returns (SceneResult);

  // One phase artifact as a presigned GET. Owner-only, and only for keys under the caller's run.
  rpc GetArtifact (GetArtifactRequest) returns (GetArtifactReply);

  rpc CancelRun (GetRunRequest) returns (Run);

  // Re-queues from phase N, invalidating downstream artifacts.
  rpc RerunFrom (RerunFromRequest) returns (SubmitRunReply);

  // Pending human gates for the caller. Requires the reviewer realm role.
  rpc ListReviews (ListReviewsRequest) returns (ListReviewsReply);

  rpc SubmitReviewDecision (SubmitReviewDecisionRequest) returns (Run);

  // The model registry with qualification and live headroom. Requires the admin realm role.
  rpc ListModels (ListModelsRequest) returns (ListModelsReply);
}

enum Sensitivity { SENSITIVITY_UNSPECIFIED = 0; PUBLIC = 1; INTERNAL = 2; CONFIDENTIAL = 3; RESTRICTED = 4; }
enum Priority    { PRIORITY_UNSPECIFIED = 0; REALTIME = 1; BULK = 2; }
enum PhaseState  { PHASE_STATE_UNSPECIFIED = 0; PENDING = 1; RUNNING = 2; DONE = 3; FAILED = 4; SKIPPED = 5; }

message CreateUploadRequest {
  string file_name = 1;
  int64 size_bytes = 2;
  reserved 3;                         // was with_layout; the format decides now, not the caller
  string content_type = 4;            // validated against the allowlist, and pinned by the policy
}

// Field numbers are reserved rather than reused: the feature is unreleased, but a reused number
// is the kind of thing that silently mis-decodes a stale client during a partial deploy.
message CreateUploadReply {
  string upload_id = 1;
  reserved 2, 3;                      // were markdown_put_url / layout_put_url
  map<string, string> fields = 4;     // post verbatim as multipart fields, with the file LAST
  int64 expires_unix_seconds = 5;
  string post_url = 6;
  int64 max_bytes = 7;                // the same number the policy enforces
}

message ListSourceFormatsRequest {}

message SourceFormat {
  string extension = 1;               // ".pdf"
  string media_type = 2;              // "application/pdf"
  string label = 3;                   // "PDF"
  bool produces_layout = 4;
  bool ocr_capable = 5;
}

message ListSourceFormatsReply {
  repeated SourceFormat formats = 1;
  int64 max_bytes = 2;
}

message SubmitRunRequest {
  string upload_id = 1;
  string document_id = 2;             // caller's id; free-form
  Sensitivity sensitivity = 3;
  string family_hint = 4;
  repeated string augmentations = 5;
  Priority priority = 6;
  string idempotency_key = 7;         // same key -> same run
  bool require_review = 8;            // opt in to the human gate regardless of policy
}

message SubmitRunReply { string run_id = 1; }

message GetRunRequest { string run_id = 1; }

message Phase {
  int32 index = 1;
  string name = 2;
  PhaseState state = 3;
  string artifact_key = 4;
  int64 started_unix_seconds = 5;
  int64 finished_unix_seconds = 6;
  string error = 7;
}

message Run {
  string run_id = 1;
  string document_id = 2;
  string family = 3;
  string condition = 4;               // clean | partial | degraded | conversational
  Sensitivity sensitivity = 5;
  Priority priority = 6;
  repeated Phase phases = 7;
  map<string, string> pinned_models = 8;
  bool requires_review = 9;
  string review_state = 10;           // none | pending | approved | rejected
  double cost_usd = 11;
  int64 created_unix_seconds = 12;
  string error = 13;
  bool cancelled = 14;
  string tree_hash = 15;
}

message RunEvent {
  string run_id = 1;
  int64 at_unix_seconds = 2;
  string phase = 3;
  PhaseState state = 4;
  string message = 5;
  int64 sequence = 6;                 // monotonic; resume a stream from the last one seen
}

message SectionNode {
  string section_id = 1;
  string title = 2;
  bool title_inferred = 3;
  int32 level = 4;
  repeated SectionNode children = 5;
  repeated string paragraph_ids = 6;
  string heading_line_id = 7;
}

message Paragraph {
  string paragraph_id = 1;
  string text = 2;
  int32 word_count = 3;
  string kind = 4;
  string content_hash = 5;
}

message Augmentation {
  string paragraph_id = 1;
  string type = 2;
  string json = 3;                    // type-specific payload, schema-validated server-side
  string review_verdict = 4;
}

message Result {
  string run_id = 1;
  SectionNode root = 2;
  repeated Paragraph paragraphs = 3;
  repeated Augmentation augmentations = 4;
  string tree_hash = 5;
  int64 frozen_unix_seconds = 6;
  repeated Finding findings = 7;
}

// ---- Scenes -----------------------------------------------------------------------------------
//
// The enumerations of the scene model cross as lowercase strings, the way `Paragraph.kind` and
// `Run.condition` already do. Proto enum values share the enclosing package's scope, and these six
// enumerations collide on their most useful names — `EXHIBITED` against `EXHIBIT`, `CONTINUES`
// against `CONTINUOUS`, `ADDRESSED` against itself in two of them — so an enum here would have to
// be prefix-mangled to compile. A string that reads as the model reads is worth more than an
// integer nothing switches on.

message GetScenesRequest {
  string run_id = 1;

  // Optional: only the scenes under this section, for a client reading one chapter of a novel
  // rather than the whole of it. Empty means the whole document.
  string section_id = 2;
}

message SceneResult {
  string run_id = 1;

  // The outline the scenes hang off, so one call renders a navigable view. Sections still carry
  // their paragraph ids; a scene names its section rather than the section naming its scenes.
  SectionNode root = 2;

  repeated Scene scenes = 3;
  repeated Persona personas = 4;
  repeated Place places = 5;
  string tree_hash = 6;
  int64 frozen_unix_seconds = 7;

  // Total scenes in the run, so a section-filtered reply can say what it is a slice of.
  int32 total_scenes = 8;
}

message Scene {
  string scene_id = 1;
  string section_id = 2;

  // Reading order across the whole document, assigned before any section filter is applied.
  int32 ordinal = 3;

  string title = 4;
  bool title_inferred = 5;
  Situation situation = 6;
  repeated SceneItem items = 7;
  repeated SceneLink links = 8;
  repeated Flag flags = 9;

  // How many scenes Setting was carried through to reach this one; 0 when it was stated here.
  int32 inheritance_depth = 10;

  repeated string paragraph_ids = 11;
  string content_hash = 12;
}

// The five-coordinate tuple. Every coordinate is always present: an empty `place_id` is Void
// rather than a missing value, and `time_relation: "unanchored"` is an answer.
message Situation {
  string place_id = 1;
  string place_name = 2;              // resolved from the place registry
  string setting_source = 3;          // stated | inferred | inherited; empty when Void
  string inherited_from_scene_id = 4;
  string time_anchor = 5;
  string time_relation = 6;           // continuous | gap | earlier | later | simultaneous | unanchored
  repeated CastMember cast = 7;
  string mode = 8;                    // enacted | narrated | expounded | addressed | exhibited
  string subject = 9;
}

message CastMember {
  string persona_id = 1;
  string name = 2;                    // resolved canonical name
  string role = 3;                    // speaking | addressed | present
}

message SceneItem {
  string item_id = 1;
  string paragraph_id = 2;

  // Half-open character offsets into the frozen paragraph, kept so a client can cite the source
  // even though it is being handed the text.
  int32 start_offset = 3;
  int32 end_offset = 4;

  string kind = 5;                    // speech | action | description | exhibit | transition

  // The span, read out of the frozen paragraph server-side. Items never store text.
  string text = 6;

  // Generated staging text for an item that cannot be shown alone; empty when it can.
  string render_text = 7;
  bool is_standalone = 8;

  Speech speech = 9;                  // set only on a speech item
  string exhibit_id = 10;
  repeated Tag tags = 11;
}

message Speech {
  string surface_form = 1;
  string speaker_persona_id = 2;
  string speaker_name = 3;            // resolved canonical name; empty until phase 9 binds one
  string embodiment = 4;              // embodied | disembodied
  string addressee = 5;               // in_scene | audience | self
  bool voiced = 6;
}

message Tag {
  string tag_id = 1;
  string kind = 2;                    // persona | group | place | exhibit_ref
  int32 start_offset = 3;             // paragraph-relative, like the item's own
  int32 end_offset = 4;
  string surface_form = 5;
  string referent_id = 6;
  repeated string member_persona_ids = 7;   // a group reference's roster at this point
  bool membership_complete = 8;             // false renders as a crowd rather than as its members
}

message SceneLink {
  string from_scene_id = 1;
  string to_scene_id = 2;
  string kind = 3;                    // continues | returns_to | flashback_of | concurrent_with | frames | framed_by
  double confidence = 4;
}

message Persona {
  string persona_id = 1;
  string canonical_name = 2;
  string kind = 3;                    // individual | group
  string scope = 4;                   // persistent | scene_local
  repeated string surface_forms = 5;
}

message Place {
  string place_id = 1;
  string canonical_name = 2;
}

// A derived review signal, never a gate.
message Flag { string kind = 1; string message = 2; }

message GetArtifactRequest { string run_id = 1; string artifact_key = 2; }
message GetArtifactReply   { string get_url = 1; int64 expires_unix_seconds = 2; }

message RerunFromRequest { string run_id = 1; int32 from_phase = 2; }

message ReviewTask {
  string review_id = 1;
  string run_id = 2;
  string document_id = 3;
  string family = 4;
  int64 created_unix_seconds = 5;
  repeated Finding findings = 6;
}

message Finding {
  string severity = 1;
  string type = 2;
  repeated string ids = 3;
  string message = 4;
}

message ListReviewsRequest { string status = 1; int32 page_size = 2; string page_token = 3; }
message ListReviewsReply   { repeated ReviewTask reviews = 1; string next_page_token = 2; }

message ParagraphEdit { string op = 1; string paragraph_id = 2; string with_paragraph_id = 3; int32 before_sentence = 4; }

message SubmitReviewDecisionRequest {
  string review_id = 1;
  string decision = 2;                // approve | approve_with_edits | reject
  string notes = 3;
  repeated ParagraphEdit edits = 4;
}

message ModelInfo {
  string key = 1;
  string provider = 2;
  string tier = 3;
  repeated string qualified_roles = 4;
  double headroom_fraction = 5;
  bool circuit_open = 6;
}

message ListModelsRequest {}
message ListModelsReply { repeated ModelInfo models = 1; }

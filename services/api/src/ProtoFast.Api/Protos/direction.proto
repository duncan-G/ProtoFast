syntax = "proto3";

option csharp_namespace = "ProtoFast.Api";

package direction;

import "story.proto";

// The director layer over a scene: how each line is delivered, which frames picture it, and what
// everyone and everything in it looks like. The author edits it in the scene editor's director
// mode, and a language model can write any part of it. Every call is confined to the caller the
// internal JWT names; anything the caller does not own reads as not found.
service Direction {

    rpc GetSceneDirection (GetSceneDirectionRequest) returns (GetSceneDirectionReply);

    // Replaces the scene's director layer. Rows are upserted by id and any left out are deleted;
    // a row that changed is marked edited, so a later directing pass keeps it.
    rpc SaveSceneDirection (SaveSceneDirectionRequest) returns (SaveSceneDirectionReply);

    // Saves the scene and its director layer in one write, so a changed line and its cue land together.
    rpc SaveDirectedScene (SaveDirectedSceneRequest) returns (SaveDirectedSceneReply);

    // Has the language model direct the scene, or one item in it, and saves what it wrote. Rows
    // the author edited are kept unless the request says to replace them.
    rpc Direct (DirectRequest) returns (DirectReply);

    // Has the language model write a character's, location's, prop's or extra's sheet from everything
    // the story says about it, and saves it.
    rpc Describe (DescribeRequest) returns (DescribeReply);

    // Speaks one line, or every dialogue, narration and action line of the scene that has no audio
    // or whose audio is stale, with the speech provider, and stores the result. A line with no cue
    // yet is spoken as written and gets one. Regenerate renders again regardless.
    rpc GenerateAudio (GenerateAudioRequest) returns (GenerateAudioReply);

    // The speech provider's voices, for casting.
    rpc ListVoices (ListVoicesRequest) returns (ListVoicesReply);

    // The speech provider's voice library, to cast a character or add a narrator from.
    rpc SearchVoices (SearchVoicesRequest) returns (ListVoicesReply);

    // Casts the character a library voice that fits their sheet and that the story doesn't use yet,
    // never the one they have. Describe casts one too, when the character has none.
    rpc CastVoice (CastVoiceRequest) returns (CastVoiceReply);

    // Pictures one frame with the image model, unless its picture is current or regenerate is set. A
    // locked frame is left as it is.
    // The pictures that already exist around it (the library's, neighbouring frames, earlier scenes
    // in the same place or with the same people) are offered as captioned references; nothing is
    // generated just to serve as one. With refine set, the current picture is edited by it instead.
    rpc GenerateFrameImage (GenerateFrameImageRequest) returns (GenerateFrameImageReply);

    // Pictures a character, location, prop or extra from its sheet: what frames are kept consistent with.
    // With refine set, the current picture is edited by it instead.
    rpc GenerateLibraryImage (GenerateLibraryImageRequest) returns (GenerateLibraryImageReply);

    // Every library picture in the story, with whether its sheet has moved on.
    rpc ListLibraryImages (ListLibraryImagesRequest) returns (ListLibraryImagesReply);

    // Pictures a character in one of the scene's looks that differs from the library's (carrying
    // something, hurt, in another outfit), unless its picture is current or regenerate is set.
    // Frames in that look take it as the character's reference instead of the library's picture.
    // Picturing a frame does this first for everyone on screen. With refine set, the current picture
    // is edited by it instead.
    rpc GenerateLookImage (GenerateLookImageRequest) returns (GenerateLookImageReply);

}

message SceneDirection {
    string scene_id = 1;
    // Which day of the story the scene happens on; looks reset between days.
    optional int32 story_day = 2;
    // In position order.
    repeated Frame frames = 3;
    repeated Cue cues = 4;
    repeated SceneAppearance appearances = 5;
    repeated ScenePropState prop_states = 6;
    // Every frame's shot, angle and movement unless it sets its own.
    optional string shot = 7;
    optional string angle = 8;
    optional string movement = 9;
    repeated SceneLocationState location_states = 10;
    // In line order per character.
    repeated LookChange look_changes = 11;
    repeated SceneExtra extras = 12;
}

// One picture of the scene, covering a contiguous run of its elements in scene order. Frames do
// not overlap.
message Frame {
    string id = 1;
    int32 position = 2;
    string first_element_id = 3;
    string last_element_id = 4;
    optional string location_id = 5;
    optional string time_of_day = 6;
    // What is happening: an action, or "MARA presses, TOM deflects".
    string beat = 7;
    reserved 11;
    // wide | medium | close | extreme close | over-the-shoulder | insert; unset takes the scene's.
    optional string shot = 8;
    // eye level | low | high | top-down; unset takes the scene's.
    optional string angle = 13;
    // static | push in | pull out | pan | handheld; unset takes the scene's.
    optional string movement = 14;
    // Only for frames with no dialogue to time them.
    optional int32 hold_ms = 9;
    // Only the characters the frame says something about; the rest follow the scene.
    repeated Placement placements = 10;
    // Only the props the frame shows or hides against the scene.
    repeated FrameProp props = 16;
    // What the frame adds to the location's look in the scene.
    string location_change = 15;
    // Written by hand; a directing pass leaves it alone.
    bool edited = 12;
    // Unset until the frame has been pictured. Read only: saves ignore it.
    optional MediaImage image = 17;
    // Only the extras the frame shows, hides or stages against the scene.
    repeated FrameExtra extras = 18;
    // Where the camera stands in the place and what it looks toward: "inside the corridor, looking
    // back at the double doors".
    string camera = 19;
    // The author is done with it: directing passes keep it as it is and its picture is never redone.
    bool locked = 20;
    // Set when the frame is the previous frame with one small change: its picture is made by editing
    // the previous frame's picture with this text alone. Empty pictures it from its full description.
    string variation = 21;
    // With a variation: the camera moves and people and props may come and go, so the previous picture
    // gives the place, light and whoever stays, and the frame's own staging and cast say the rest.
    bool variation_moves_camera = 22;
    // The part of the location the camera is in, one of its variations; unset is where the
    // location's establishing shot stands.
    optional string location_variation_id = 23;
}

message MediaImage {
    string asset_id = 1;
    // Presigned; it expires, so it comes with every load.
    string url = 2;
    string content_type = 3;
    // What it pictures has changed since, or a library picture it was composed from was redone.
    bool stale = 4;
    // The pictures it was offered to compose from: "MARA", "Frame 2", "Frame 4 of THE DOCKS".
    repeated string references = 5;
    // The image model's summary of how it made the picture.
    string notes = 6;
}

message LibraryImage {
    // character | location | locationVariation | prop | extra
    string subject_kind = 1;
    string subject_id = 2;
    MediaImage image = 3;
}

message Placement {
    reserved 5;
    string character_id = 1;
    // left | centre | right | off, or empty.
    string screen = 2;
    string pose = 3;
    string expression = 4;
    // toward camera | three-quarter left | screen left | back three-quarter left | away from camera |
    // back three-quarter right | screen right | three-quarter right, or empty. A three-quarter turn
    // shows the face; a back three-quarter turn shows the back.
    string facing = 10;
    // still | left to right | right to left | toward camera | away from camera, or toward/away from
    // camera with a side ("toward camera, left to right"), or empty.
    string moving = 11;
    // Who or what they look at: "the nurse".
    string looking = 12;
    // foreground | midground | background, or empty.
    string depth = 13;
    // Where in the place they are, in the place's own terms: "at the near end of the nurse station counter".
    string mark = 14;
    // Unset follows the scene's appearance.
    optional bool on_screen = 6;
    // Unset wears the scene's wardrobe.
    optional string wardrobe_id = 7;
    // Added to the scene's changes, never replacing them.
    string wardrobe_change = 8;
    string appearance_change = 9;
}

message FrameProp {
    string prop_id = 1;
    bool in_view = 2;
    // Where it is, as on a Placement; a carried prop goes where its holder is.
    string screen = 3;
    string depth = 4;
    string mark = 5;
}

message FrameExtra {
    string extra_id = 1;
    // Unset follows the scene.
    optional bool on_screen = 2;
    // As on a Placement; pose says which of a group the staging is about.
    string screen = 3;
    string facing = 4;
    string moving = 5;
    string looking = 6;
    string pose = 7;
    string depth = 8;
    string mark = 9;
}

// How a dialogue, narration or action line is delivered.
message Cue {
    string id = 1;
    string element_id = 2;
    // The line's own words with delivery tags, e.g. "[sad] I'm sorry." The words never change.
    string performance = 3;
    // Minimum silence before the line, in milliseconds; negative overlaps the previous one.
    int32 gap_before_ms = 4;
    // Cut off by the next line.
    bool interrupted = 5;
    bool edited = 6;
    // Unset until the line has been spoken.
    optional CueAudio audio = 7;
    // Who reads an action or narration line; unset is the story's first narrator.
    optional string narrator_id = 8;
}

message CueAudio {
    string asset_id = 1;
    // A presigned URL the player streams from; it expires, so it is fetched with the direction.
    string url = 2;
    string content_type = 3;
    // The performance or the voice changed since this was rendered.
    bool stale = 4;
    string voice = 5;
}

// A character in the scene: whether frames show them, and their look as the scene opens: a wardrobe
// from their sheet, what the scene changes about it and about them, and what they carry.
message SceneAppearance {
    reserved 4;
    string id = 1;
    string character_id = 2;
    optional string wardrobe_id = 3;
    // On screen in every frame unless a frame says otherwise; unset is on screen.
    optional bool on_screen = 8;
    // "hood up, damp from the drizzle"
    string wardrobe_change = 9;
    // "left hand bandaged"
    string appearance_change = 10;
    // Why this differs from the character's previous look.
    optional string change_reason = 5;
    optional string change_element_id = 6;
    bool edited = 7;
    // Prop ids they carry: in hand, under an arm, slung over a shoulder.
    repeated string holding = 11;
    // Unset while the look is the library's, or until pictured. Read only: saves ignore it.
    optional MediaImage image = 12;
    // left to right | right to left, or empty: the way they move across the screen all scene.
    string travel = 13;
}

// A character's whole look from one line of the scene on: the frame covering the line and every
// frame after it show it, and the next scene opens with the last one.
message LookChange {
    string id = 1;
    string character_id = 2;
    string element_id = 3;
    optional string wardrobe_id = 4;
    string wardrobe_change = 5;
    string appearance_change = 6;
    repeated string holding = 7;
    // "hands the cooler to the doctor"
    optional string reason = 8;
    bool edited = 9;
    // Unset while the look is the library's, or until pictured. Read only: saves ignore it.
    optional MediaImage image = 10;
}

message ScenePropState {
    string id = 1;
    string prop_id = 2;
    // "broken", "lit"; empty means as the sheet describes it.
    repeated string state = 3;
    optional string change_reason = 4;
    optional string change_element_id = 5;
    bool edited = 6;
    // In view in every frame unless a frame says otherwise; unset is in view.
    optional bool in_view = 7;
}

// An extra in the scene; frames picture them unless a frame says otherwise.
message SceneExtra {
    string id = 1;
    string extra_id = 2;
    // Unset is on screen.
    optional bool on_screen = 3;
    bool edited = 4;
}

// What is different about a location in the scene, on top of its sheet: "fog rolling in".
message SceneLocationState {
    string id = 1;
    string location_id = 2;
    string change = 3;
    bool edited = 4;
}

message GetSceneDirectionRequest {
    string scene_id = 1;
}

message GetSceneDirectionReply {
    SceneDirection direction = 1;
}

message SaveSceneDirectionRequest {
    SceneDirection direction = 1;
}

message SaveSceneDirectionReply {
    SceneDirection direction = 1;
}

message SaveDirectedSceneRequest {
    story.Scene scene = 1;
    SceneDirection direction = 2;
}

message SaveDirectedSceneReply {
    SceneDirection direction = 1;
}

// What to direct. The whole scene finds its extras, then runs the story day, looks, prop states, cues
// and frames in turn. Locked frames keep their rows and everything on them, even when replacing.
message DirectRequest {
    string scene_id = 1;
    oneof target {
        bool scene = 2;
        // The cue for this dialogue or narration line.
        string cue_element_id = 3;
        // This frame's shot, beat, placements and props, keeping its range. A locked frame is left as it is.
        string frame_id = 4;
        // The scene's frames, from scratch.
        bool frames = 5;
        // Every line's cue.
        bool cues = 6;
        // This character's look in the scene and how it changes during it.
        string appearance_character_id = 7;
        // This prop's state in the scene.
        string prop_state_prop_id = 8;
        // Every look and prop state in the scene.
        bool continuity = 9;
        // Which day of the story the scene falls on.
        bool story_day = 10;
        // The extras the scene needs, from the library or added to it.
        bool extras = 12;
    }
    // Also rewrite rows the author edited.
    bool replace_edited = 11;
    // The author's directions for a single frame, which the model follows over its own choices.
    string instructions = 13;
}

message DirectReply {
    SceneDirection direction = 1;
    // The story's extras after the pass, which may have added some.
    repeated story.Extra extras = 2;
    // What the verifiers still found wrong with the frames the pass directed, after it fixed what it could.
    repeated FrameFinding findings = 3;
}

message FrameFinding {
    string frame_id = 1;
    // consistency | positioning
    string check = 2;
    string issue = 3;
}

message DescribeRequest {
    oneof subject {
        string character_id = 1;
        string location_id = 2;
        string prop_id = 3;
        string extra_id = 4;
    }
}

message DescribeReply {
    oneof subject {
        story.Character character = 1;
        story.Location location = 2;
        story.Prop prop = 3;
        story.Extra extra = 4;
    }
}

message GenerateAudioRequest {
    string scene_id = 1;
    // One line; unset means every line that needs it.
    optional string element_id = 2;
    bool regenerate = 3;
}

message GenerateAudioReply {
    SceneDirection direction = 1;
}

message ListVoicesRequest {}

message ListVoicesReply {
    string provider = 1;
    repeated Voice voices = 2;
}

message CastVoiceRequest {
    string character_id = 1;
}

message CastVoiceReply {
    story.Character character = 1;
}

message SearchVoicesRequest {
    // ISO 639-1; empty is "en".
    string language = 1;
    string search = 2;
    // The provider's labels, e.g. "female", "middle_aged", "british"; empty is any.
    string gender = 3;
    string age = 4;
    string accent = 5;
    // Only voices made for narration.
    bool narration = 6;
}

message Voice {
    string id = 1;
    string name = 2;
    string description = 3;
    // "male · middle aged · british"
    string traits = 4;
    // A short sample to audition the voice; may be empty.
    string preview_url = 5;
}

message GenerateFrameImageRequest {
    string scene_id = 1;
    string frame_id = 2;
    bool regenerate = 3;
    // What to change in the current picture, which is edited by this alone and keeps the rest; it
    // stays current, and pictures composed from it go stale. A redraw starts again from the description.
    string refine = 4;
    // A picture of the story's (a library entry's, a frame's) to take what the change needs from;
    // only with refine.
    string refine_reference_asset_id = 5;
}

message GenerateFrameImageReply {
    SceneDirection direction = 1;
}

message GenerateLibraryImageRequest {
    oneof subject {
        string character_id = 1;
        string location_id = 2;
        string prop_id = 3;
        string extra_id = 5;
        // Drawn from its location's picture when there is one.
        string location_variation_id = 8;
    }
    bool regenerate = 4;
    // As GenerateFrameImageRequest.refine.
    string refine = 6;
    // As GenerateFrameImageRequest.refine_reference_asset_id.
    string refine_reference_asset_id = 7;
}

message GenerateLibraryImageReply {
    LibraryImage image = 1;
}

message ListLibraryImagesRequest {
    string story_id = 1;
}

message ListLibraryImagesReply {
    repeated LibraryImage images = 1;
}

message GenerateLookImageRequest {
    string scene_id = 1;
    string character_id = 2;
    // The look change's line; unset is the look the scene opens with.
    optional string element_id = 3;
    bool regenerate = 4;
    // As GenerateFrameImageRequest.refine.
    string refine = 5;
    // As GenerateFrameImageRequest.refine_reference_asset_id.
    string refine_reference_asset_id = 6;
}

message GenerateLookImageReply {
    SceneDirection direction = 1;
}

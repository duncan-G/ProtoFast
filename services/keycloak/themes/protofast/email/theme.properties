# ProtoFast Keycloak email theme — the Nocturne design system, so the mail the
# realm sends reads as the same product as the auth pages and the marketing site.
#
# parent=base, deliberately: base's own html/*.ftl all do
# `<#import "template.ftl" as layout>`, and FreeMarker resolves that name through
# the theme chain — so every email we do NOT override (org invites, identity
# provider links, the event notifications) still renders inside this theme's
# emailLayout and picks up the shell for free. Only the emails this realm
# actually sends are overridden below, to give them a heading and a real
# call-to-action button instead of base's single "click the link" sentence.
#
# There is no `styles=` here and there cannot be: Keycloak serves email theme
# resources to nobody, and half of email clients drop <link> anyway. All styling
# is inline on the elements, with a small <style> block in html/template.ftl for
# the few things inlining cannot reach (media queries, and the prose of the
# inherited base templates whose markup we do not control).
parent=base

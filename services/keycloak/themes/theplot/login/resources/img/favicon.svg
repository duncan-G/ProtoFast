<!--
  ThePlot mark — the plot-point: the square that closes the wordmark, set
  large on the page ground so it carries at 16px on a browser tab. Same
  file as clients/theplot/public/favicon.svg.

  Standalone file, so the Ember tokens are inlined as their hex values —
    bg #14110f, accent #e8794a (oklch(0.72 0.15 45) flattened).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ThePlot">
  <rect width="32" height="32" rx="7" fill="#14110f"/>
  <rect x="10" y="10" width="12" height="12" fill="#e8794a"/>
</svg>
